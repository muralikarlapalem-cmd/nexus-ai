#version: "3.9"     # I commented it KMK

# ─────────────────────────────────────────────────────────────
#  NEXUS AI  ·  docker-compose.yml
#  Phase 2: + Qdrant vector DB + Ollama (local embeddings)
#  Services: postgres | redis | keycloak | qdrant | ollama
#            api | celery-worker | celery-beat
# ─────────────────────────────────────────────────────────────

networks:
  nexus-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  keycloak_data:
  qdrant_data:
  ollama_data:

services:

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    networks:
      - nexus-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in .env} -d ${POSTGRES_DB:?Set POSTGRES_DB in .env}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────
  redis:
    #image: redis:7-alpine
    image: redis/redis-stack-server:latest
    container_name: nexus-redis
    restart: unless-stopped
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    #command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}

    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - nexus-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Qdrant (Vector DB) ── Phase 2 ────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: nexus-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"    # HTTP REST API
      - "6334:6334"    # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
      - ./qdrant_config.yaml:/qdrant/config/production.yaml:ro
    networks:
      - nexus-net

  # ── Ollama (local embeddings — free, no API key) ─ Phase 2 ──
  ollama:
    image: ollama/ollama:latest
    container_name: nexus-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - nexus-net
    # Pull nomic-embed-text on first start
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull nomic-embed-text && wait"]

  # ── Keycloak ─────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: nexus-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KC_ADMIN:?Set KC_ADMIN in .env}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?Set KC_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      KC_DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexus-net

  # ── FastAPI Backend ───────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - nexus-net
    volumes:
      - ./backend:/app
      - ./rag:/rag          # mount rag module into container
      - ./agents:/agents
    environment:
      - PYTHONPATH=/app:/
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Celery Worker ─────────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-celery
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONPATH=/app:/
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - nexus-net
    volumes:
      - ./backend:/app
      - ./rag:/rag
      - ./agents:/agents
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4 -Q default,agents,rag,evals
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Celery Beat ───────────────────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-beat
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nexus-net
    volumes:
      - ./backend:/app
    command: celery -A app.workers.celery_app beat --loglevel=info
    healthcheck:
      test: ["NONE"]