#version: "3.9"     # I commented it KMK

# ─────────────────────────────────────────────────────────────
#  NEXUS AI  ·  docker-compose.yml
#  Phase 2: + Qdrant vector DB + Ollama (local embeddings)
#  Services: postgres | redis | keycloak | qdrant | ollama
#            api | celery-worker | celery-beat
#  Observability: prometheus | grafana | jaeger | loki | alloy
# ─────────────────────────────────────────────────────────────

networks:
  nexus-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  keycloak_data:
  qdrant_data:
  ollama_data:
  servicenow_mock_data:
  prometheus_data:
  grafana_data:
  loki_data:

services:

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    networks:
      - nexus-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in .env} -d ${POSTGRES_DB:?Set POSTGRES_DB in .env}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────
  redis:
    #image: redis:7-alpine
    image: redis/redis-stack-server:latest
    container_name: nexus-redis
    restart: unless-stopped
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    #command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}

    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - nexus-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Qdrant (Vector DB) ── Phase 2 ────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: nexus-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"    # HTTP REST API
      - "6334:6334"    # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
      - ./qdrant_config.yaml:/qdrant/config/production.yaml:ro
    networks:
      - nexus-net

  # ── Ollama (local embeddings — free, no API key) ─ Phase 2 ──
  ollama:
    image: ollama/ollama:latest
    container_name: nexus-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - nexus-net
    # Pull nomic-embed-text on first start
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull nomic-embed-text && wait"]

  # ── Keycloak ─────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: nexus-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KC_ADMIN:?Set KC_ADMIN in .env}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?Set KC_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      KC_DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexus-net

  # ── Mock ServiceNow (local testing of the integration) ──────
  # Copies ServiceNow's Table API so NEXUS can import incidents and post work
  # notes without a real instance. Web page: http://localhost:8090
  servicenow-mock:
    build:
      context: ./mock_servicenow
    container_name: nexus-servicenow-mock
    restart: unless-stopped
    environment:
      MOCK_SN_USER: ${MOCK_SN_USER:-nexus.integration}
      # Empty until you set it in .env: the mock then refuses every API call
      MOCK_SN_PASSWORD: ${INTEGRATION_SERVICENOW_MOCK_PASSWORD:-}
      MOCK_SN_DB: /data/servicenow.db
      # Optional OAuth: client ID nexus-mock-client + this secret. MOCK_SN_BASIC_AUTH=false
      # then makes the mock refuse password logins, like OAuth-only instances.
      MOCK_SN_CLIENT_SECRET: ${INTEGRATION_SERVICENOW_MOCK_CLIENT_SECRET:-}
      MOCK_SN_BASIC_AUTH: ${MOCK_SN_BASIC_AUTH:-true}
      # Optional push mode: set after creating the connection (see INTEGRATIONS.md)
      MOCK_SN_WEBHOOK_URL: ${MOCK_SN_WEBHOOK_URL:-}
      MOCK_SN_WEBHOOK_TOKEN: ${INTEGRATION_SERVICENOW_MOCK_WEBHOOK_SECRET:-}
    volumes:
      - servicenow_mock_data:/data
    ports:
      - "8090:8090"
    networks:
      - nexus-net

  # ── FastAPI Backend ───────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - nexus-net
    volumes:
      - ./backend:/app
      - ./rag:/rag          # mount rag module into container
      - ./agents:/agents
    environment:
      - PYTHONPATH=/app:/
      # OpenTelemetry traces → Jaeger (http://localhost:16686). Set to empty in .env to turn off.
      - OTEL_ZIPKIN_ENDPOINT=${OTEL_ZIPKIN_ENDPOINT-http://jaeger:9411/api/v2/spans}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Celery Worker ─────────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-celery
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONPATH=/app:/
      # The 4 worker processes share their Prometheus metrics through this folder;
      # the combined numbers are served on :9101 for Prometheus
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - nexus-net
    volumes:
      - ./backend:/app
      - ./rag:/rag
      - ./agents:/agents
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4 -Q default,agents,rag,evals
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Celery Beat ───────────────────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-beat
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nexus-net
    volumes:
      - ./backend:/app
    command: celery -A app.workers.celery_app beat --loglevel=info
    healthcheck:
      test: ["NONE"]

  # ── Prometheus (metrics) ──────────────────────────────────────
  # Scrapes the API (/metrics) and the Celery worker (:9101) every 15 s.
  # UI: http://localhost:9090
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: nexus-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - nexus-net

  # ── Grafana (dashboards) ──────────────────────────────────────
  # http://localhost:3000 — the "NEXUS AI" dashboard opens without signing in;
  # sign in as admin (password from .env) to edit it.
  grafana:
    image: grafana/grafana:11.3.1
    container_name: nexus-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/nexus.json
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - nexus-net

  # ── Jaeger (OpenTelemetry traces) ─────────────────────────────
  # Receives the API's request and database spans (Zipkin format on :9411).
  # UI: http://localhost:16686 → service "nexus-api"
  jaeger:
    image: jaegertracing/all-in-one:1.63.0
    container_name: nexus-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
    ports:
      - "16686:16686"
    networks:
      - nexus-net

  # ── Loki (logs) ───────────────────────────────────────────────
  # Stores the NEXUS containers' logs for 7 days. The Security agent's
  # scan_system_logs tool queries it; Grafana → Explore → Loki shows them.
  loki:
    image: grafana/loki:3.3.2
    container_name: nexus-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - nexus-net

  # ── Alloy (log collector) ─────────────────────────────────────
  # Reads every nexus-* container's output through the Docker socket
  # (read-only) and sends it to Loki. Debug UI: http://localhost:12345
  alloy:
    image: grafana/alloy:v1.5.1
    container_name: nexus-alloy
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345"
    depends_on:
      - loki
    networks:
      - nexus-net
