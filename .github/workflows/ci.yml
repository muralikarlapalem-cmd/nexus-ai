name: NEXUS AI CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexusai_test
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_secret
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://nexus:nexus_secret@localhost:5432/nexusai_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      JWT_SECRET_KEY: ci-test-secret-key-at-least-32-chars
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_REALM: nexus
      KEYCLOAK_CLIENT_ID: nexus-backend
      KEYCLOAK_CLIENT_SECRET: test-secret
      KEYCLOAK_JWKS_URL: http://localhost:8080/realms/nexus/protocol/openid-connect/certs
      POSTGRES_PASSWORD: nexus_secret
      REDIS_PASSWORD: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run Alembic migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v --asyncio-mode=auto

      - name: Lint (ruff)
        working-directory: backend
        run: pip install ruff && ruff check app/

  eval-gate:
    runs-on: ubuntu-latest
    needs: backend-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install deps
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run RAG evals (CI gate)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}   # the RAG pipeline and evals call OpenAI
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        run: python -m evals.rag_evals --ci --output evals/results/rag_results.json
      - name: Upload eval results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
